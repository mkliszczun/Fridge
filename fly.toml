# fly.toml app configuration file generated for fridge-app-api on 2025-10-12T12:51:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fridge-app-api'
primary_region = 'ams'

[build]

[env]
  # Public traffic must enter via Fly's HTTP handler (which supplies Fly-Client-IP).
  ABUSE_TRUST_FLY_PROXY = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
