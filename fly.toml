# fly.toml app configuration file generated for fridge-app-api on 2026-09-23T21:04:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fridge-app-api'
primary_region = 'ams'

[build]

[env]
  # Public traffic must enter via Fly's HTTP handler (which supplies Fly-Client-IP).
  ABUSE_TRUST_FLY_PROXY = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  checks = [{ grace_period = '1m0s', interval = '30s', method = 'GET', path = '/health', timeout = '5s' }]

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
