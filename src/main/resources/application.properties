spring.application.name=demo
abuse.enabled=${ABUSE_PROTECTION_ENABLED:true}
abuse.trust-fly-proxy=${ABUSE_TRUST_FLY_PROXY:false}
abuse.login-per15-minutes=${AUTH_LOGIN_PER_15_MINUTES:20}
abuse.registrations-per-hour=${AUTH_REGISTRATIONS_PER_HOUR:3}
abuse.global-registrations-per-day=${AUTH_GLOBAL_REGISTRATIONS_PER_DAY:100}
abuse.password-requests-per15-minutes=${AUTH_PASSWORD_REQUESTS_PER_15_MINUTES:5}
abuse.refresh-per15-minutes=${AUTH_REFRESH_PER_15_MINUTES:60}
abuse.email-sends-per15-minutes=${AUTH_EMAIL_SENDS_PER_15_MINUTES:10}
abuse.email-verifications-per15-minutes=${AUTH_EMAIL_VERIFICATIONS_PER_15_MINUTES:20}
ai.budget.enabled=${AI_ENABLED:true}
ai.budget.global-daily-usd=${AI_GLOBAL_DAILY_BUDGET_USD:10.00}
spring.datasource.url=${DATABASE_URL}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
logging.level.org.springframework.web.reactive.function.client=INFO
logging.pattern.level=%5p [requestId=%X{requestId:-none}]
# Request/error diagnostics are logged by the application without SQL or bound values.
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
# Database driver error messages can include row contents. SafeDiagnostics logs SQLState instead.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
server.port=${PORT:8080}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true


jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:900000}

openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.6-luna}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=45s

# Standard short-context prices, USD per million tokens. Update all prices together with model.
ai.budget.priced-model=${OPENAI_PRICED_MODEL:gpt-5.6-luna}
ai.budget.input-price=${OPENAI_INPUT_PRICE:0.20}
ai.budget.cached-input-price=${OPENAI_CACHED_INPUT_PRICE:0.02}
ai.budget.cache-write-price=${OPENAI_CACHE_WRITE_PRICE:0.25}
ai.budget.output-price=${OPENAI_OUTPUT_PRICE:1.20}
ai.budget.free-daily-usd=${AI_FREE_DAILY_BUDGET_USD:0.10}
ai.budget.free-daily-uses=${AI_FREE_DAILY_USES:3}
ai.budget.premium-daily-usd=${AI_PREMIUM_DAILY_BUDGET_USD:0.50}

account.reset-url=${PASSWORD_RESET_URL:}
account.mail-from=${MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
