spring.application.name=demo
spring.datasource.url=${DATABASE_URL}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
logging.level.org.springframework.web.reactive.function.client=DEBUG
server.port=${PORT:8080}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true


jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:900000}

openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.6-luna}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=45s

# Standard short-context prices, USD per million tokens. Update all prices together with model.
ai.budget.priced-model=${OPENAI_PRICED_MODEL:gpt-5.6-luna}
ai.budget.input-price=${OPENAI_INPUT_PRICE:0.20}
ai.budget.cached-input-price=${OPENAI_CACHED_INPUT_PRICE:0.02}
ai.budget.output-price=${OPENAI_OUTPUT_PRICE:1.20}
ai.budget.daily-usd=${AI_DAILY_BUDGET_USD:1.00}

account.reset-url=${PASSWORD_RESET_URL:}
account.mail-from=${MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
