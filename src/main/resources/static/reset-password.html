<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'">
  <title>Fridge — nowe hasło</title>
  <script src="/reset-password.js" defer></script>
</head>
<body>
  <main>
    <h1>Ustaw nowe hasło</h1>
    <form id="reset-form">
      <p><label>Nowe hasło (minimum 8 znaków) <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label></p>
      <p><label>Powtórz hasło <input id="confirmation" type="password" autocomplete="new-password" required></label></p>
      <button id="submit" type="submit">Zapisz hasło</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
